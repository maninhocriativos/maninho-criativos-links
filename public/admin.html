<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Maninho Criativos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- ── LOGIN ── -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <img src="Images/Logotipo.PNG" alt="Maninho Criativos" class="login-logo"
           onerror="this.style.display='none'" />
      <h1 class="login-title">Painel Admin</h1>
      <p class="login-sub">Digite sua senha para continuar</p>
      <div class="input-wrap">
        <input id="pwd-input" type="password" class="admin-input" placeholder="Senha••••••" autocomplete="current-password" />
        <button class="btn-icon" onclick="togglePwd()" title="Ver senha">👁</button>
      </div>
      <button class="btn-primary full" onclick="doLogin()">Entrar</button>
      <p class="error-msg" id="login-error"></p>
    </div>
  </div>

  <!-- ── PAINEL ── -->
  <div id="admin-panel" style="display:none">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <img src="Images/Logotipo.PNG" alt="Logo" class="sidebar-logo-img"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block'" />
        <span class="sidebar-logo-text" style="display:none">MC Admin</span>
      </div>
      <nav class="sidebar-nav">
        <button class="snav-item active" data-tab="links" onclick="setTab('links',this)">
          <span class="snav-icon">🔗</span><span>Links</span>
        </button>
        <button class="snav-item" data-tab="portfolio" onclick="setTab('portfolio',this)">
          <span class="snav-icon">🖼</span><span>Portfólio</span>
        </button>
        <button class="snav-item" data-tab="profile" onclick="setTab('profile',this)">
          <span class="snav-icon">👤</span><span>Perfil</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <a href="/" class="snav-item ghost" target="_blank">
          <span class="snav-icon">🌐</span><span>Ver página</span>
        </a>
        <a href="/portfolio.html" class="snav-item ghost" target="_blank">
          <span class="snav-icon">🖼</span><span>Ver portfólio</span>
        </a>
        <button class="snav-item ghost" onclick="logout()">
          <span class="snav-icon">🚪</span><span>Sair</span>
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="admin-main">
      <!-- Header -->
      <header class="admin-topbar">
        <button class="btn-icon mobile-menu-btn" id="mobile-menu-btn">☰</button>
        <h2 class="admin-page-title" id="admin-page-title">Gerenciar Links</h2>
        <div id="tab-actions"></div>
      </header>

      <!-- ── TAB: LINKS ── -->
      <section id="tab-links" class="tab-content active">
        <!-- Add link form -->
        <div class="panel-card" id="add-link-panel">
          <div class="panel-card-header">
            <h3>➕ Novo link</h3>
            <button class="btn-icon" onclick="togglePanel('add-link-panel')">✕</button>
          </div>
          <form class="link-form" id="add-link-form" onsubmit="submitNewLink(event)">
            <div class="form-row">
              <div class="form-field">
                <label>Título *</label>
                <input class="admin-input" id="l-title" type="text" placeholder="ex: Instagram" required />
              </div>
              <div class="form-field">
                <label>Ícone (emoji)</label>
                <input class="admin-input" id="l-icon" type="text" placeholder="📸" maxlength="4" />
              </div>
            </div>
            <div class="form-field">
              <label>URL *</label>
              <input class="admin-input" id="l-url" type="url" placeholder="https://instagram.com/..." required />
            </div>
            <div class="form-row">
              <div class="form-field">
                <label>Cor início</label>
                <div class="color-wrap">
                  <input class="admin-input color-text" id="l-color-from-txt" type="text" value="#667eea" maxlength="7" />
                  <input class="color-picker" id="l-color-from" type="color" value="#667eea" oninput="syncColor(this,'l-color-from-txt')" />
                </div>
              </div>
              <div class="form-field">
                <label>Cor fim</label>
                <div class="color-wrap">
                  <input class="admin-input color-text" id="l-color-to-txt" type="text" value="#764ba2" maxlength="7" />
                  <input class="color-picker" id="l-color-to" type="color" value="#764ba2" oninput="syncColor(this,'l-color-to-txt')" />
                </div>
              </div>
              <div class="form-field">
                <label>Ordem</label>
                <input class="admin-input" id="l-order" type="number" value="0" min="0" style="max-width:80px" />
              </div>
            </div>
            <!-- Preview -->
            <div class="link-preview" id="link-preview">
              <div class="preview-icon" id="prev-icon">🔗</div>
              <span class="preview-title" id="prev-title">Título do link</span>
              <span class="preview-arrow">→</span>
            </div>
            <div class="form-actions">
              <button type="button" class="btn-secondary" onclick="togglePanel('add-link-panel')">Cancelar</button>
              <button type="submit" class="btn-primary">Adicionar link</button>
            </div>
          </form>
        </div>

        <!-- Links table -->
        <div class="links-table-wrap">
          <div class="table-header-row">
            <span class="table-count" id="links-count">0 links</span>
            <button class="btn-primary small" onclick="togglePanel('add-link-panel')">+ Novo link</button>
          </div>
          <div id="links-table" class="links-table">
            <div class="table-skeleton"></div>
            <div class="table-skeleton"></div>
            <div class="table-skeleton"></div>
          </div>
        </div>
      </section>

      <!-- ── TAB: PORTFÓLIO ── -->
      <section id="tab-portfolio" class="tab-content">
        <div class="panel-card" id="add-portfolio-panel">
          <div class="panel-card-header">
            <h3>➕ Novo item</h3>
            <button class="btn-icon" onclick="togglePanel('add-portfolio-panel')">✕</button>
          </div>
          <form class="link-form" id="add-portfolio-form" onsubmit="submitNewPortfolio(event)">
            <div class="form-row">
              <div class="form-field">
                <label>Título *</label>
                <input class="admin-input" id="pf-title" type="text" placeholder="ex: Personagem 3D" required />
              </div>
              <div class="form-field">
                <label>Categoria</label>
                <select class="admin-input" id="pf-cat">
                  <option value="Ensaio Fotográfico">📸 Ensaio Fotográfico</option>
                  <option value="Design 3D">🎨 Design 3D</option>
                  <option value="IA Generativa">🤖 IA Generativa</option>
                </select>
              </div>
            </div>
            <div class="form-field">
              <label>URL da imagem *</label>
              <input class="admin-input" id="pf-url" type="url" placeholder="https://... ou /ensaio/foto-1.webp" required />
            </div>
            <div class="form-field">
              <label>Descrição (opcional)</label>
              <input class="admin-input" id="pf-desc" type="text" placeholder="Breve descrição do trabalho" />
            </div>
            <div class="form-field">
              <label>Ordem</label>
              <input class="admin-input" id="pf-order" type="number" value="0" min="0" style="max-width:80px" />
            </div>
            <div class="form-actions">
              <button type="button" class="btn-secondary" onclick="togglePanel('add-portfolio-panel')">Cancelar</button>
              <button type="submit" class="btn-primary">Adicionar</button>
            </div>
          </form>
        </div>

        <div class="links-table-wrap">
          <div class="table-header-row">
            <span class="table-count" id="portfolio-count">0 itens</span>
            <div style="display:flex;gap:8px">
              <a href="/portfolio.html" target="_blank" class="btn-secondary small" style="text-decoration:none;font-size:0.8rem;padding:7px 14px">Ver portfólio ↗</a>
              <button class="btn-primary small" onclick="togglePanel('add-portfolio-panel')">+ Novo item</button>
            </div>
          </div>
          <div id="portfolio-table" class="links-table">
            <div class="table-skeleton"></div>
            <div class="table-skeleton"></div>
            <div class="table-skeleton"></div>
          </div>
        </div>
      </section>

      <!-- ── TAB: PROFILE ── -->
      <section id="tab-profile" class="tab-content">
        <div class="panel-card">
          <form class="link-form" id="profile-form" onsubmit="submitProfile(event)">
            <div class="form-row">
              <div class="form-field">
                <label>Nome exibido</label>
                <input class="admin-input" id="p-name" type="text" placeholder="Maninho Criativos" />
              </div>
            </div>
            <div class="form-field">
              <label>Bio / descrição</label>
              <input class="admin-input" id="p-bio" type="text" placeholder="Criatividade sem limites ✨" />
            </div>
            <div class="form-field">
              <label>URL do avatar (opcional)</label>
              <input class="admin-input" id="p-avatar" type="url" placeholder="https://..." />
            </div>
            <div class="form-row three">
              <div class="form-field">
                <label>Cor fundo início</label>
                <div class="color-wrap">
                  <input class="admin-input color-text" id="p-bg-from-txt" type="text" value="#030810" maxlength="7" />
                  <input class="color-picker" id="p-bg-from" type="color" value="#030810" oninput="syncColor(this,'p-bg-from-txt')" />
                </div>
              </div>
              <div class="form-field">
                <label>Cor fundo meio</label>
                <div class="color-wrap">
                  <input class="admin-input color-text" id="p-bg-via-txt" type="text" value="#070e1c" maxlength="7" />
                  <input class="color-picker" id="p-bg-via" type="color" value="#070e1c" oninput="syncColor(this,'p-bg-via-txt')" />
                </div>
              </div>
              <div class="form-field">
                <label>Cor fundo fim</label>
                <div class="color-wrap">
                  <input class="admin-input color-text" id="p-bg-to-txt" type="text" value="#0c1728" maxlength="7" />
                  <input class="color-picker" id="p-bg-to" type="color" value="#0c1728" oninput="syncColor(this,'p-bg-to-txt')" />
                </div>
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn-primary">Salvar perfil</button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <!-- ── EDIT MODAL ── -->
  <div id="edit-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Editar link</h3>
        <button class="btn-icon" onclick="closeModal()">✕</button>
      </div>
      <form id="edit-link-form" onsubmit="submitEditLink(event)">
        <input type="hidden" id="edit-id" />
        <div class="form-row">
          <div class="form-field">
            <label>Título *</label>
            <input class="admin-input" id="edit-title" type="text" required />
          </div>
          <div class="form-field">
            <label>Ícone</label>
            <input class="admin-input" id="edit-icon" type="text" maxlength="4" />
          </div>
        </div>
        <div class="form-field">
          <label>URL *</label>
          <input class="admin-input" id="edit-url" type="url" required />
        </div>
        <div class="form-row">
          <div class="form-field">
            <label>Cor início</label>
            <div class="color-wrap">
              <input class="admin-input color-text" id="edit-cf-txt" type="text" maxlength="7" />
              <input class="color-picker" id="edit-cf" type="color" oninput="syncColor(this,'edit-cf-txt')" />
            </div>
          </div>
          <div class="form-field">
            <label>Cor fim</label>
            <div class="color-wrap">
              <input class="admin-input color-text" id="edit-ct-txt" type="text" maxlength="7" />
              <input class="color-picker" id="edit-ct" type="color" oninput="syncColor(this,'edit-ct-txt')" />
            </div>
          </div>
          <div class="form-field">
            <label>Ordem</label>
            <input class="admin-input" id="edit-order" type="number" min="0" style="max-width:80px" />
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn-primary">Salvar alterações</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="admin.js"></script>
</body>
</html>
