<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Maninho Criativos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <!-- Login screen -->
  <div id="login-screen" class="login-screen" style="display:none">
    <div class="login-box">
      <h2>🔐 Admin</h2>
      <div class="form-group">
        <label for="pwd-input">Senha</label>
        <input id="pwd-input" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary" onclick="doLogin()">Entrar</button>
      <p class="error-msg" id="login-error"></p>
    </div>
  </div>

  <!-- Admin panel -->
  <main id="admin-panel" class="container admin-container" style="display:none">
    <div class="admin-header">
      <h1>⚙️ Admin</h1>
      <div style="display:flex;gap:8px;align-items:center">
        <a href="/" class="btn btn-ghost">← Ver página</a>
        <button class="btn btn-ghost" onclick="logout()">Sair</button>
      </div>
    </div>

    <!-- Profile section -->
    <section style="margin-bottom:28px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 style="font-size:1rem;font-weight:700;color:var(--text-secondary)">PERFIL</h2>
        <button class="btn btn-ghost" onclick="toggleForm('profile-form')">✏️ Editar</button>
      </div>
      <div id="profile-form" class="form-card">
        <div class="form-grid">
          <div class="form-group">
            <label>Nome</label>
            <input id="p-name" type="text" placeholder="Maninho Criativos" />
          </div>
          <div class="form-group">
            <label>Avatar URL</label>
            <input id="p-avatar" type="url" placeholder="https://..." />
          </div>
          <div class="form-group full">
            <label>Bio</label>
            <input id="p-bio" type="text" placeholder="Criatividade sem limites ✨" />
          </div>
          <div class="form-group">
            <label>Cor fundo (início)</label>
            <input id="p-bg-from" type="color" value="#0f0c29" />
          </div>
          <div class="form-group">
            <label>Cor fundo (meio)</label>
            <input id="p-bg-via" type="color" value="#302b63" />
          </div>
          <div class="form-group">
            <label>Cor fundo (fim)</label>
            <input id="p-bg-to" type="color" value="#24243e" />
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end">
          <button class="btn btn-ghost" onclick="toggleForm('profile-form')">Cancelar</button>
          <button class="btn btn-primary" onclick="saveProfile()">Salvar perfil</button>
        </div>
      </div>
    </section>

    <!-- Links section -->
    <section>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 style="font-size:1rem;font-weight:700;color:var(--text-secondary)">LINKS</h2>
        <button class="btn btn-primary" onclick="toggleForm('new-link-form')">+ Novo link</button>
      </div>

      <!-- New link form -->
      <div id="new-link-form" class="form-card">
        <div class="form-grid">
          <div class="form-group">
            <label>Título</label>
            <input id="l-title" type="text" placeholder="Instagram" />
          </div>
          <div class="form-group">
            <label>Ícone (emoji)</label>
            <input id="l-icon" type="text" placeholder="📸" maxlength="4" />
          </div>
          <div class="form-group full">
            <label>URL</label>
            <input id="l-url" type="url" placeholder="https://instagram.com/..." />
          </div>
          <div class="form-group">
            <label>Cor (início)</label>
            <input id="l-color-from" type="color" value="#667eea" />
          </div>
          <div class="form-group">
            <label>Cor (fim)</label>
            <input id="l-color-to" type="color" value="#764ba2" />
          </div>
          <div class="form-group">
            <label>Ordem</label>
            <input id="l-order" type="number" value="0" min="0" />
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end">
          <button class="btn btn-ghost" onclick="toggleForm('new-link-form')">Cancelar</button>
          <button class="btn btn-primary" onclick="createLink()">Adicionar link</button>
        </div>
      </div>

      <!-- Links list -->
      <div id="admin-links-list" class="admin-links-list">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
