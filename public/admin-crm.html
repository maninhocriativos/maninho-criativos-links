<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin CRM — Maninho Criativos</title>
  <link rel="stylesheet" href="admin-crm.css" />
</head>
<body>

<div id="app" class="app-shell">

  <!-- SIDEBAR (desktop) -->
  <aside class="app-sidebar" id="sidebar">

    <!-- Brand -->
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon">M</div>
      <div class="sidebar-brand-text">
        <div class="sidebar-brand-name">Maninho</div>
        <div class="sidebar-brand-site">links</div>
      </div>
    </div>

    <!-- Nav -->
    <div class="sidebar-nav">
      <div class="sidebar-nav-label">Painel</div>

      <button class="nav-item active" data-route="analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        <span>Analytics</span>
      </button>

      <button class="nav-item" data-route="links">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
        </svg>
        <span>Links</span>
      </button>

      <button class="nav-item" data-route="portfolio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>Portfólio</span>
      </button>

      <button class="nav-item" data-route="leads">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>
        </svg>
        <span>Leads</span>
        <span class="nav-badge" id="leads-badge" style="display:none">0</span>
      </button>

      <button class="nav-item" data-route="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Perfil</span>
      </button>
    </div>

    <!-- Spacer -->
    <div class="sidebar-spacer"></div>

    <!-- Footer -->
    <div class="sidebar-footer">
      <button class="sidebar-footer-item" id="btn-visit-site">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        <span>Ver site</span>
      </button>
      <button class="sidebar-footer-item" id="btn-logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>Sair</span>
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="app-main">

    <!-- TOPBAR -->
    <header class="app-topbar" id="topbar">
      <div class="topbar-title">
        <h1 id="topbar-title">Analytics</h1>
        <div class="topbar-subtitle" id="topbar-subtitle"></div>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>

    <!-- SCROLL AREA -->
    <div class="app-scroll" id="scroll">

      <!-- Views (renderizadas por JS) -->
      <div id="view-analytics" class="view" style="display:none"></div>
      <div id="view-links" class="view" style="display:none"></div>
      <div id="view-portfolio" class="view" style="display:none"></div>
      <div id="view-leads" class="view" style="display:none"></div>
      <div id="view-profile" class="view" style="display:none"></div>

    </div>
  </main>

  <!-- BOTTOM NAV (mobile) -->
  <nav class="app-bottomnav" id="bottomnav">
    <button class="bnav-item active" data-route="analytics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span style="font-size:9px">Analytics</span>
    </button>
    <button class="bnav-item" data-route="links">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
      </svg>
      <span style="font-size:9px">Links</span>
    </button>
    <button class="bnav-item" data-route="portfolio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      <span style="font-size:9px">Portf</span>
    </button>
    <button class="bnav-item" data-route="leads">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>
      </svg>
      <span style="font-size:9px">Leads</span>
      <span class="bnav-badge" id="bnav-badge" style="display:none">0</span>
    </button>
    <button class="bnav-item" data-route="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      <span style="font-size:9px">Perfil</span>
    </button>
  </nav>

</div>

<!-- Scripts -->
<script src="admin-crm.js"></script>

</body>
</html>
