<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>Pagamento recebido | Maninho Criativos</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#080b12;color:#f7f8fb;font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(520px,100%);padding:40px;border:1px solid #253047;border-radius:24px;background:#111725;text-align:center;box-shadow:0 24px 80px #0008}.icon{width:72px;height:72px;margin:auto;display:grid;place-items:center;border-radius:50%;background:#123c2b;color:#43e08f;font-size:38px}h1{margin:20px 0 8px;font-size:30px}p{margin:0;color:#b8c0d0}.actions{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}a{padding:12px 18px;border-radius:12px;text-decoration:none;font-weight:700;color:#07101a;background:#43e08f}a.secondary{color:#e9edf5;background:#202a3b}small{display:block;margin-top:22px;color:#7f8a9e}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">✓</div>
    <h1>Pagamento recebido</h1>
    <p>Obrigado! A InfinitePay está confirmando o pagamento e nosso financeiro será atualizado automaticamente.</p>
    <div class="actions"><a id="receipt" class="secondary" hidden rel="noopener noreferrer">Ver comprovante</a><a href="/">Voltar ao site</a></div>
    <small>Maninho Criativos • contato@maninhocriativos.com.br</small>
  </main>
  <script>
    const value = new URLSearchParams(location.search).get('receipt_url');
    if (value) { try { const url = new URL(value); if (url.protocol === 'https:') { const link = document.getElementById('receipt'); link.href = url.href; link.hidden = false; } } catch {} }
  </script>
</body>
</html>
