<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a0a14"/>
      <stop offset="50%"  stop-color="#0d1528"/>
      <stop offset="100%" stop-color="#0f2040"/>
    </linearGradient>
    <!-- Grid sutil -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,212,255,0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="900" fill="url(#bg)"/>
  <rect width="800" height="900" fill="url(#grid)"/>
