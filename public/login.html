<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Maninho Criativos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan: #00d4ff;
      --blue: #0055ff;
      --dark: #030810;
      --surface: #080f1e;
      --border: rgba(255,255,255,.08);
      --text: #fff;
      --text2: rgba(255,255,255,.5);
      --ease: cubic-bezier(.4,0,.2,1);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--dark);
      color: var(--text);
      overflow: hidden;
    }

    /* Background animado */
    .bg {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
    }
    .bg-orb {
      position: absolute; border-radius: 50%;
      filter: blur(120px); opacity: .12;
      animation: drift 20s ease-in-out infinite alternate;
    }
    .bg-orb.a { width: 600px; height: 600px; background: var(--blue); top: -200px; left: -100px; }
    .bg-orb.b { width: 500px; height: 500px; background: var(--cyan); bottom: -150px; right: -80px; animation-delay: -10s; }
    .bg-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,.03) 1px, transparent 1px);
      background-size: 52px 52px;
    }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(40px,-60px); } }

    /* Layout */
    .page {
      position: relative; z-index: 1;
      min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }

    /* Card */
    .card {
      width: 100%; max-width: 400px;
      background: rgba(8,15,30,.85);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 40px 36px 36px;
      box-shadow: 0 32px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(0,212,255,.06);
      backdrop-filter: blur(24px);
      animation: slideup .4s var(--ease);
    }
    @keyframes slideup { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

    .card-header {
      display: flex; flex-direction: column; align-items: center;
      gap: 12px; margin-bottom: 32px;
    }
    .card-logo { height: 36px; width: auto; object-fit: contain; }
    .card-logo-fallback {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 1.1rem; color: #fff;
    }
    .card-title {
      font-size: 1.3rem; font-weight: 800; letter-spacing: -.4px;
      text-align: center;
    }
    .card-sub {
      font-size: .82rem; color: var(--text2); text-align: center;
    }

    /* Form */
    .form { display: flex; flex-direction: column; gap: 14px; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label {
      font-size: .72rem; font-weight: 700; letter-spacing: .5px;
      text-transform: uppercase; color: var(--text2);
    }
    .field-wrap { position: relative; }
    .field-wrap svg {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      color: rgba(255,255,255,.25); pointer-events: none;
    }
    .field-wrap input {
      width: 100%; background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08); border-radius: 10px;
      padding: 12px 14px 12px 40px;
      color: var(--text); font-size: .9rem; font-family: inherit; outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .field-wrap input:focus {
      border-color: var(--cyan); background: rgba(0,212,255,.04);
      box-shadow: 0 0 0 3px rgba(0,212,255,.1);
    }
    .field-wrap input::placeholder { color: rgba(255,255,255,.2); }
    .toggle-pwd {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,.25); transition: color .2s; padding: 2px;
    }
    .toggle-pwd:hover { color: rgba(255,255,255,.6); }

    .btn-login {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #fff; border: none; border-radius: 10px;
      font-size: .95rem; font-weight: 700; font-family: inherit;
      cursor: pointer; margin-top: 4px;
      box-shadow: 0 0 28px rgba(0,212,255,.25);
      transition: all .22s var(--ease);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 0 44px rgba(0,212,255,.4); }
    .btn-login:active { transform: none; }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    .error-box {
      display: none; align-items: center; gap: 8px;
      background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.2);
      border-radius: 8px; padding: 10px 12px;
      font-size: .82rem; color: #f87171;
    }
    .error-box.show { display: flex; }

    .card-footer {
      margin-top: 24px; text-align: center;
      font-size: .75rem; color: var(--text2);
    }
    .card-footer a { color: var(--cyan); text-decoration: none; }
    .card-footer a:hover { text-decoration: underline; }

    /* Spinner */
    .spinner {
      width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .6s linear infinite; display: none;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="bg">
    <div class="bg-orb a"></div>
    <div class="bg-orb b"></div>
    <div class="bg-grid"></div>
  </div>

  <div class="page">
    <div class="card">
      <div class="card-header">
        <img src="Images/Logotipo.PNG" alt="Maninho Criativos" class="card-logo"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
        <div class="card-logo-fallback" style="display:none">MC</div>
        <div>
          <p class="card-title">Painel Administrativo</p>
          <p class="card-sub">Entre com suas credenciais para continuar</p>
        </div>
      </div>

      <form class="form" id="login-form" onsubmit="doLogin(event)">
        <div class="field">
          <label for="inp-user">Usuário</label>
          <div class="field-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input id="inp-user" type="text" placeholder="Seu usuário" autocomplete="username" required />
          </div>
        </div>

        <div class="field">
          <label for="inp-pwd">Senha</label>
          <div class="field-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input id="inp-pwd" type="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="toggle-pwd" onclick="togglePwd()" title="Mostrar senha">
              <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="error-box" id="error-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span id="error-msg">Usuário ou senha incorretos</span>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          <span class="btn-text">Entrar</span>
          <div class="spinner"></div>
        </button>
      </form>

      <p class="card-footer">
        <a href="/">← Voltar para o site</a>
      </p>
    </div>
  </div>

  <script>
    const TOKEN_KEY = 'mc_admin_token';

    // Já logado? Redireciona
    if (sessionStorage.getItem(TOKEN_KEY)) {
      window.location.replace('/admin.html');
    }

    function togglePwd() {
      const inp = document.getElementById('inp-pwd');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    async function doLogin(e) {
      e.preventDefault();
      const username = document.getElementById('inp-user').value.trim();
      const password = document.getElementById('inp-pwd').value;
      const btn      = document.getElementById('btn-login');
      const errBox   = document.getElementById('error-box');
      const errMsg   = document.getElementById('error-msg');

      errBox.classList.remove('show');
      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          const { token } = await res.json();
          sessionStorage.setItem(TOKEN_KEY, token);
          window.location.replace('/admin.html');
        } else {
          const data = await res.json().catch(() => ({}));
          errMsg.textContent = data.error || 'Usuário ou senha incorretos';
          errBox.classList.add('show');
          document.getElementById('inp-pwd').value = '';
        }
      } catch {
        errMsg.textContent = 'Erro de conexão. Tente novamente.';
        errBox.classList.add('show');
      }

      btn.classList.remove('loading');
      btn.disabled = false;
    }
  </script>

</body>
</html>
