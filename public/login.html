<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Maninho Criativos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --bg2: #111111;
      --border: rgba(255,255,255,.08);
      --border2: rgba(255,255,255,.12);
      --text: #ededed;
      --text2: #888;
      --text3: #555;
      --accent: #0070f3;
      --red: #e5484d;
      --ease: cubic-bezier(.16,1,.3,1);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--dark);
      color: var(--text);
      overflow: hidden;
    }

    /* Background animado */
    .bg {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
    }
    .bg-orb {
      position: absolute; border-radius: 50%;
      filter: blur(120px); opacity: .12;
      animation: drift 20s ease-in-out infinite alternate;
    }
    .bg-orb.a { width: 600px; height: 600px; background: var(--accent); top: -200px; left: -100px; }
    .bg-orb.b { width: 500px; height: 500px; background: #7c3aed; bottom: -150px; right: -80px; animation-delay: -10s; }
    .bg-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,.03) 1px, transparent 1px);
      background-size: 52px 52px;
    }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(40px,-60px); } }

    /* Layout */
    .page {
      position: relative; z-index: 1;
      min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }

    /* Card */
    .card {
      width: 100%; max-width: 380px;
      background: rgba(17,17,17,.92);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
      backdrop-filter: blur(24px);
      animation: slideup .3s var(--ease);
    }
    @keyframes slideup { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

    .card-header {
      display: flex; flex-direction: column; align-items: center;
      gap: 12px; margin-bottom: 32px;
    }
    .card-logo { height: 36px; width: auto; object-fit: contain; }
    .card-logo-fallback {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 1.1rem; color: #fff;
    }
    .card-title {
      font-size: 1.3rem; font-weight: 800; letter-spacing: -.4px;
      text-align: center;
    }
    .card-sub {
      font-size: .82rem; color: var(--text2); text-align: center;
    }

    /* Form */
    .form { display: flex; flex-direction: column; gap: 14px; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label {
      font-size: .72rem; font-weight: 700; letter-spacing: .5px;
      text-transform: uppercase; color: var(--text2);
    }
    .field-wrap { position: relative; }
    .field-wrap svg {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      color: rgba(255,255,255,.25); pointer-events: none;
    }
    .field-wrap input {
      width: 100%; background: rgba(255,255,255,.04);
      border: 1px solid var(--border2); border-radius: 8px;
      padding: 0 14px 0 40px; height: 38px;
      color: var(--text); font-size: .86rem; font-family: inherit; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .field-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,112,243,.2);
    }
    .field-wrap input::placeholder { color: rgba(255,255,255,.2); }
    .toggle-pwd {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,.25); transition: color .2s; padding: 2px;
    }
    .toggle-pwd:hover { color: rgba(255,255,255,.6); }

    .btn-login {
      width: 100%; height: 38px;
      background: var(--accent);
      color: #fff; border: none; border-radius: 8px;
      font-size: .88rem; font-weight: 600; font-family: inherit;
      cursor: pointer; margin-top: 4px;
      transition: background .15s, box-shadow .15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-login:hover { background: #0060df; box-shadow: 0 0 0 4px rgba(0,112,243,.25); }
    .btn-login:active { background: #0050cc; }
    .btn-login:disabled { opacity: .55; cursor: not-allowed; }

    .error-box {
      display: none; align-items: center; gap: 8px;
      background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.2);
      border-radius: 8px; padding: 10px 12px;
      font-size: .82rem; color: #f87171;
    }
    .error-box.show { display: flex; }

    .card-footer {
      margin-top: 24px; text-align: center;
      font-size: .75rem; color: var(--text2);
    }
    .card-footer a { color: var(--cyan); text-decoration: none; }
    .card-footer a:hover { text-decoration: underline; }

    /* Spinner */
    .spinner {
      width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .6s linear infinite; display: none;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="bg">
    <div class="bg-orb a"></div>
    <div class="bg-orb b"></div>
    <div class="bg-grid"></div>
  </div>

  <div class="page">
    <div class="card">
      <div class="card-header">
        <img src="Images/Logotipo.webp" alt="Maninho Criativos" class="card-logo" width="800" height="533"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
        <div class="card-logo-fallback" style="display:none">MC</div>
        <div>
          <p class="card-title">Painel Administrativo</p>
          <p class="card-sub">Entre com suas credenciais para continuar</p>
        </div>
      </div>

      <form class="form" id="login-form" onsubmit="doLogin(event)">
        <div class="field">
          <label for="inp-email">E-mail administrativo</label>
          <div class="field-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input id="inp-email" type="email" placeholder="seu@email.com" autocomplete="username" required />
          </div>
        </div>

        <div class="field" id="otp-step" hidden>
          <label for="inp-code">Código enviado por e-mail</label>
          <div class="field-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M4 4h16v16H4z"/><path d="m4 7 8 6 8-6"/>
            </svg>
            <input id="inp-code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" autocomplete="one-time-code" />
          </div>
        </div>

        <div class="field">
          <label for="inp-pwd">Senha</label>
          <div class="field-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input id="inp-pwd" type="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="toggle-pwd" onclick="togglePwd()" title="Mostrar senha">
              <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="error-box" id="error-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span id="error-msg">Usuário ou senha incorretos</span>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          <span class="btn-text">Entrar</span>
          <div class="spinner"></div>
        </button>
      </form>

      <p class="card-footer">
        <a href="/">← Voltar para o site</a>
      </p>
    </div>
  </div>

  <script>
    let challengeId = null;
    fetch('/api/admin/verify').then(res => {
      if (res.ok) window.location.replace('/admin.html');
    }).catch(() => {});

    function togglePwd() {
      const inp = document.getElementById('inp-pwd');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    async function doLogin(e) {
      e.preventDefault();
      const email    = document.getElementById('inp-email').value.trim();
      const password = document.getElementById('inp-pwd').value;
      const code     = document.getElementById('inp-code').value.trim();
      const btn      = document.getElementById('btn-login');
      const errBox   = document.getElementById('error-box');
      const errMsg   = document.getElementById('error-msg');

      errBox.classList.remove('show');
      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const res = await fetch(challengeId ? '/api/admin/verify-email' : '/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(challengeId ? { challenge_id: challengeId, code } : { email, password })
        });

        if (res.ok) {
          const data = await res.json();
          if (data.requires_verification) {
            challengeId = data.challenge_id;
            document.getElementById('otp-step').hidden = false;
            document.getElementById('inp-code').required = true;
            document.getElementById('inp-email').disabled = true;
            document.getElementById('inp-pwd').disabled = true;
            document.querySelector('.btn-text').textContent = 'Verificar código';
            document.querySelector('.card-sub').textContent = 'Digite o código enviado para seu e-mail';
            document.getElementById('inp-code').focus();
          } else {
            window.location.replace('/admin.html');
          }
        } else {
          const data = await res.json().catch(() => ({}));
          errMsg.textContent = data.error || 'Não foi possível autenticar';
          errBox.classList.add('show');
          if (challengeId) document.getElementById('inp-code').value = '';
          else document.getElementById('inp-pwd').value = '';
        }
      } catch {
        errMsg.textContent = 'Erro de conexão. Tente novamente.';
        errBox.classList.add('show');
      }

      btn.classList.remove('loading');
      btn.disabled = false;
    }
  </script>

</body>
</html>
