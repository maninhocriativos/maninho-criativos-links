<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Maninho Criativos — Design 3D, IA Generativa e Criatividade Digital" />
  <meta property="og:title" content="Maninho Criativos" />
  <meta property="og:description" content="Design 3D · IA Generativa · Tutoriais" />
  <meta property="og:image" content="/Images/Logotipo.PNG" />
  <title>Maninho Criativos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ══ HERO ══ -->
  <section class="hero">
    <!-- fundo: foto do criador -->
    <div class="hero-photo-bg">
      <img src="Images/foto-real.jpg" alt="" class="hero-bg-img"
           onerror="this.style.display='none'" />
      <div class="hero-bg-overlay"></div>
      <div class="hero-bg-grid"></div>
    </div>

    <!-- conteúdo sobreposto -->
    <div class="hero-body">
      <!-- badge de ferramentas -->
      <div class="tool-badges">
        <span class="tool-badge">✦ Design 3D</span>
        <span class="tool-badge">✦ IA Generativa</span>
        <span class="tool-badge">✦ Blender</span>
        <span class="tool-badge">✦ Midjourney</span>
      </div>

      <!-- foto central (se não tiver foto-real.jpg usa esta) -->
      <div class="hero-portrait-wrap">
        <img src="Images/foto-real.jpg" alt="Maninho Criativos"
             class="hero-portrait"
             onerror="this.src='Images/Maninho.png'" />
        <div class="portrait-glow"></div>
      </div>

      <!-- identidade -->
      <div class="hero-identity">
        <img src="Images/Logotipo.PNG" alt="Maninho Criativos" class="hero-logo"
             onerror="this.style.display='none'" />
        <h1 class="hero-name">Maninho Criativos</h1>
        <p class="hero-role">Designer 3D &amp; Criador de Conteúdo</p>
      </div>

      <!-- scroll cue -->
      <a href="#links" class="scroll-cue" aria-label="Ver links">
        <div class="scroll-cue-inner">↓</div>
      </a>
    </div>
  </section>

  <!-- ══ LINK BANNERS ══ -->
  <section class="links-section" id="links">
    <div class="links-wrap" id="links-container">
      <!-- Skeleton -->
      <div class="banner-skeleton"></div>
      <div class="banner-skeleton"></div>
      <div class="banner-skeleton"></div>
    </div>
  </section>

  <!-- ══ BIO ══ -->
  <section class="bio-section">
    <div class="bio-inner">
      <div class="bio-avatar-wrap">
        <img src="Images/Maninho.png" alt="Maninho Criativos" class="bio-avatar"
             onerror="this.src='Images/Manitinha.png'" />
        <div class="bio-avatar-ring"></div>
      </div>
      <div class="bio-name-row">
        <span class="bio-name" id="bio-name">MANINHO CRIATIVOS</span>
        <span class="bio-verified">✔</span>
      </div>
      <p class="bio-text" id="bio-text">
        Criatividade sem limites — Design 3D, Inteligência Artificial e muito conteúdo para você evoluir.
      </p>
      <div class="bio-socials" id="bio-socials"></div>
    </div>
  </section>

  <!-- ══ FOOTER ══ -->
  <footer class="site-footer">
    <span>© 2025 Maninho Criativos — Todos os direitos reservados</span>
    <a href="admin.html" class="footer-admin" title="Admin">⚙</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
