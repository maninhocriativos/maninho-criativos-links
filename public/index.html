<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Links do Maninho Criativos" />
  <title>Maninho Criativos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main class="container">
    <div class="profile">
      <div class="avatar-wrapper">
        <div class="avatar-ring"></div>
        <img id="avatar" class="avatar" src="https://ui-avatars.com/api/?name=MC&background=667eea&color=fff&size=120&bold=true&font-size=0.4" alt="Avatar Maninho Criativos" />
        <div class="avatar-status"></div>
      </div>
      <h1 id="profile-name" class="profile-name">Maninho Criativos</h1>
      <p id="profile-bio" class="profile-bio">Criatividade sem limites ✨</p>
    </div>

    <div id="links-container" class="links-list" role="list">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>

    <footer class="footer">
      <a href="admin.html" class="admin-link" title="Painel admin">⚙</a>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
